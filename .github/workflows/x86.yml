# The x86_64 kernel on x86 hardware: the end-to-end tests with
# GRIX_ARCH=x86_64 on a GitHub x86 runner, with KVM: in grix-vmm, and in
# QEMU microvm (-accel kvm). For every push to main, and to ci/**
# branches, to try things without making a release.
name: x86

on:
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: "0.17.0"
  ZIG_SHA256: "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"

jobs:
  kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub's x86 runners have KVM; the device needs opening up.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          grep -c -E 'vmx|svm' /proc/cpuinfo
      # The proxy's real echoes go out on the host's ICMP sockets, which a
      # user that isn't root gets only by this.
      - name: ICMP
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-system-arm golang-go
          curl -sSfL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o zig.tar.xz
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c
          mkdir -p "$HOME/zig" && tar xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-none aarch64-unknown-none-softfloat
      # The arm64 kernel too: arm64 images run here, emulated.
      - name: The kernels, grix, grix-vmm and the Python module
        run: |
          (cd kernel && cargo build --release --target x86_64-unknown-none && cargo build --release)
          cargo build --release -p grix -p grix-vmm
          make python
      - name: Fixtures
        run: |
          ./fixtures/build.sh
          python3 -I tools/alpine.py --arch x86_64 --out fixtures/build/alpine-x86_64 busybox-static busybox
          python3 -I tools/alpine.py --arch x86_64 --out fixtures/build/python-x86_64 python3 ca-certificates-bundle
          python3 -I tools/alpine.py --arch x86_64 --out fixtures/build/node-x86_64 nodejs
          ./target/release/grix pull alpine:3.21 --oci fixtures/build/oci-x86_64/alpine
          ./target/release/grix pull debian:bookworm-slim --oci fixtures/build/oci-x86_64/debian
          ./target/release/grix pull --arch aarch64 alpine:3.21 --oci fixtures/build/oci/alpine
      - name: Unit tests
        run: cargo test -p grix --lib
      - name: A first run in grix-vmm
        run: |
          printf 'fn main() { println!("hello from {}", std::env::args().nth(1).unwrap()); std::process::exit(7); }\n' > hello.rs
          rustup target add x86_64-unknown-linux-musl
          rustc --target x86_64-unknown-linux-musl -C linker=rust-lld -O hello.rs -o hello
          set +e
          out=$(./target/release/grix run -v --timeout 60 -i ./hello:/bin/hello -- /bin/hello grix-vmm 2>&1)
          code=$?
          set -e
          echo "$out (exit $code)"
          echo "$out" | grep -q "hello from grix-vmm" && [ "$code" = 7 ]
      # What a user does first: an image from Docker Hub, with no
      # architecture given. It's x86_64's, and runs natively in grix-vmm.
      - name: An image from Docker Hub, natively in grix-vmm
        run: |
          ./target/release/grix build --from alpine:3.21 -o alpine.grix
          ./target/release/grix inspect alpine.grix | tee /dev/stderr | grep -q '"arch": "x86_64"'
          out=$(./target/release/grix run -v --image alpine.grix -a process -- /bin/sh -c 'uname -m; cat /etc/alpine-release' 2>&1)
          echo "$out"
          echo "$out" | grep -qx 'grix: an x86_64 machine in grix-vmm'
          echo "$out" | grep -qx x86_64
          echo "$out" | grep -q '^3\.21\.'
      # The MCP server's and Python's tests pick their fixtures by
      # GRIX_ARCH too, so they run on each architecture.
      - name: End-to-end tests on the x86_64 kernel, in grix-vmm (KVM)
        run: |
          GRIX_ARCH=x86_64 cargo test -p grix --test guest --test runtimes --test mcp
          GRIX_ARCH=x86_64 python3 -m unittest discover -s python/tests
      - name: End-to-end tests on the x86_64 kernel, in QEMU (KVM)
        run: |
          GRIX_VMM=qemu GRIX_ARCH=x86_64 cargo test -p grix --test guest --test runtimes --test mcp
          GRIX_VMM=qemu GRIX_ARCH=x86_64 python3 -m unittest discover -s python/tests
      # Alone, so its machine has the runner's cores to itself.
      - name: End-to-end tests on the vm network stack, in grix-vmm (KVM)
        run: |
          GRIX_NETWORK=vm GRIX_ARCH=x86_64 cargo test -p grix --test guest --test runtimes --test mcp
          GRIX_NETWORK=vm GRIX_ARCH=x86_64 python3 -m unittest discover -s python/tests
      - name: Threads in parallel on 4 CPUs, in grix-vmm (KVM)
        run: GRIX_STRICT_SPEEDUP=1 GRIX_ARCH=x86_64 cargo test -p grix --test guest -- --exact threads_run_in_parallel_on_more_cpus
      - name: End-to-end tests on the x86_64 kernel with 4 CPUs, in grix-vmm (KVM)
        run: GRIX_CPUS=4 GRIX_ARCH=x86_64 cargo test -p grix --test guest --test runtimes
