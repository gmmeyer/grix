# Every push to main builds grix and, if its version (Cargo.toml's
# workspace version, bumped with every commit by tools/bump-version.sh)
# hasn't been released yet, releases it as v<version>: the kernel, and grix
# and grix-vmm for arm64 macOS and arm64 Linux (static).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release builds look for the kernel and grix-vmm only where they're
  # installed, never at paths from this machine (sandbox.rs SOURCE_TREE).
  GRIX_RELEASE_BUILD: "1"

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          command -v rustup || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; }
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal
          "$HOME/.cargo/bin/rustup" target add aarch64-unknown-none-softfloat x86_64-unknown-none
      - name: Build the kernels (arm64, and x86_64 for GRIX_ARCH=x86_64)
        run: |
          cd kernel
          cargo build --release
          cargo build --release --target x86_64-unknown-none
          mkdir -p ../kernel-out
          cp target/aarch64-unknown-none-softfloat/release/grix-kernel ../kernel-out/grix-kernel
          cp target/x86_64-unknown-none/release/grix-kernel ../kernel-out/grix-kernel-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel
          path: kernel-out/
          if-no-files-found: error

  linux-arm64:
    needs: kernel
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel
          path: kernel-out
      # The Dockerfile's build stage: static grix and grix-vmm (musl).
      - name: Build grix and grix-vmm
        run: |
          docker build --platform linux/arm64 --target build --build-arg GRIX_RELEASE_BUILD=1 -t grix-build .
          id=$(docker create grix-build)
          docker cp "$id:/out/bin" out-bin
          docker rm "$id"
          file out-bin/grix out-bin/grix-vmm
      - name: Unit tests, and the Python module
        run: |
          command -v rustup || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; }
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          cargo test -p grix --lib
          cargo build --release -p grix-python
      # A static program, booted in the kernel just built (QEMU here: the
      # runners may not have KVM).
      - name: Smoke test
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
          printf '#include <stdio.h>\nint main(int c, char **v) { printf("hello from %%s\\n", v[1]); return 7; }\n' > hello.c
          gcc -static -O2 -o hello hello.c
          cp kernel-out/grix-kernel kernel-out/grix-kernel-x86_64 out-bin/
          set +e
          out=$(GRIX_ACCEL=tcg ./out-bin/grix run --timeout 120 -i ./hello:/bin/hello -- /bin/hello grix)
          code=$?
          set -e
          echo "$out (exit $code)"
          [ "$out" = "hello from grix" ] && [ "$code" = 7 ]
          ./out-bin/grix --version
      # The x86_64 kernel (GRIX_ARCH=x86_64: QEMU microvm, emulated here),
      # with a static x86_64 program Rust builds (no x86 C toolchain here).
      - name: Smoke test, x86_64
        run: |
          sudo apt-get install -y -q qemu-system-x86
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add x86_64-unknown-linux-musl
          printf 'fn main() { let a: Vec<String> = std::env::args().collect(); println!("hello from {}", a[1]); std::process::exit(7); }\n' > hello.rs
          rustc --target x86_64-unknown-linux-musl -C linker=rust-lld -C opt-level=2 hello.rs -o hello-x86_64
          set +e
          out=$(GRIX_ARCH=x86_64 ./out-bin/grix run --timeout 120 -i ./hello-x86_64:/bin/hello -- /bin/hello grix)
          code=$?
          set -e
          echo "$out (exit $code)"
          [ "$out" = "hello from grix" ] && [ "$code" = 7 ]
      - name: Package
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          d=grix-$v-linux-arm64
          mkdir -p "$d/python/grix"
          cp out-bin/grix out-bin/grix-vmm kernel-out/grix-kernel kernel-out/grix-kernel-x86_64 README.md "$d/"
          cp python/grix/__init__.py "$d/python/grix/"
          cp target/release/lib_native.so "$d/python/grix/_native.abi3.so"
          PYTHONPATH="$d/python" GRIX_BIN="$d/grix" python3 -c 'import grix; assert grix.native()'
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64
          path: grix-*-linux-arm64.tar.gz
          if-no-files-found: error

  macos-arm64:
    needs: kernel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kernel
          path: kernel-out
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build grix and grix-vmm
        run: |
          cargo build --release -p grix -p grix-vmm
          # Hypervisor.framework runs only programs with its entitlement; an
          # ad-hoc signature carries it.
          codesign --sign - --entitlements crates/vmm/entitlements.plist --force target/release/grix-vmm
      - name: Unit tests, and the Python module
        run: |
          cargo test -p grix --lib
          cargo build --release -p grix-python
      - name: Package
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          d=grix-$v-macos-arm64
          mkdir -p "$d/python/grix"
          cp target/release/grix target/release/grix-vmm kernel-out/grix-kernel kernel-out/grix-kernel-x86_64 README.md "$d/"
          cp python/grix/__init__.py "$d/python/grix/"
          cp target/release/lib_native.dylib "$d/python/grix/_native.abi3.so"
          PYTHONPATH="$d/python" GRIX_BIN="$d/grix" python3 -c 'import grix; assert grix.native()'
          ./target/release/grix --version
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: grix-*-macos-arm64.tar.gz
          if-no-files-found: error

  release:
    needs: [linux-arm64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released: bump the version (tools/bump-version.sh) to release this commit"
            exit 0
          fi
          prev=$(git tag --list 'v*' --sort=-v:refname | head -1)
          {
            echo "grix $v, built from $(git rev-parse --short HEAD)."
            echo
            if [ -n "$prev" ]; then
              echo "Since $prev:"
              git log --format='- %s' "$prev..HEAD"
            else
              git log -1 --format='- %s'
            fi
            echo
            echo "Each archive has grix, grix-vmm and the grix kernel (grix finds it beside itself),"
            echo "and the Python package with its native module (\`PYTHONPATH=python\`, Python 3.9+)."
            echo "macOS: arm64, macOS 15+; if it came through a browser, \`xattr -d com.apple.quarantine grix grix-vmm\`."
            echo "Linux: arm64, static; grix-vmm needs /dev/kvm (otherwise grix uses QEMU)."
          } > notes.md
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          gh release create "v$v" dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "grix $v" --notes-file notes.md
