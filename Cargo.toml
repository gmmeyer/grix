[workspace]
resolver = "3"
members = ["crates/abi", "crates/grix", "crates/vmm", "crates/python", "crates/web"]
# `cargo build` alone builds these (grix-python needs Python to build).
default-members = ["crates/abi", "crates/grix", "crates/vmm"]
exclude = ["kernel"]

[workspace.package]
version = "0.0.23"
edition = "2024"
license = "MIT"
