<meta name="description" content="The grix blog.">
<script>
  // The palette (palettes.css) and light or dark, before anything paints:
  // ?palette= and ?scheme= choose and are remembered; the system decides
  // the scheme otherwise.
  (() => {
    const root = document.documentElement, q = new URLSearchParams(location.search);
    const pick = (key) => {
      let v = q.get(key);
      try { if (v) localStorage.setItem('grix-' + key, v); else v = localStorage.getItem('grix-' + key); } catch {}
      return v;
    };
    const palette = pick('palette'), scheme = pick('scheme');
    if (palette && palette !== 'blue') root.dataset.palette = palette;
    if (palette) root.dataset.chooser = '';
    const dark = matchMedia('(prefers-color-scheme: dark)');
    const apply = () => (root.dataset.scheme = scheme === 'light' || scheme === 'dark' ? scheme : dark.matches ? 'dark' : 'light');
    apply();
    dark.addEventListener('change', apply);
  })();
</script>
<link rel="stylesheet" href="/palettes.css">
<link rel="stylesheet" href="/site.css">

<script>
  // Comparing palettes: a chooser, once one was picked with ?palette=.
  (() => {
    const root = document.documentElement;
    if (!('chooser' in root.dataset)) return;
    const palettes = [['blue', 'Blue'], ['claude', 'Claude Code'], ['github', 'GitHub'], ['one', 'One Dark / Light'],
                      ['tokyo-night', 'Tokyo Night'], ['catppuccin', 'Catppuccin'], ['dracula', 'Dracula'],
                      ['nord', 'Nord'], ['solarized', 'Solarized'], ['rose-pine', 'Rosé Pine'],
                      ['gruvbox', 'Gruvbox'], ['everforest', 'Everforest'], ['kanagawa', 'Kanagawa']];
    const schemes = [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']];
    const box = document.createElement('div');
    box.className = 'palette-chooser';
    const save = (k, v) => { try { localStorage.setItem('grix-' + k, v); } catch {} };
    const current = () => root.dataset.palette || 'blue';
    const setPalette = (k) => {
      save('palette', k);
      if (k === 'blue') delete root.dataset.palette; else root.dataset.palette = k;
      render();
    };
    const render = () => {
      let scheme = 'auto';
      try { scheme = localStorage.getItem('grix-scheme') || 'auto'; } catch {}
      box.innerHTML = '<span>Palette</span><button data-step="-1" aria-label="Previous palette">‹</button>' +
        '<select aria-label="Palette">' + palettes.map(([k, n]) =>
          `<option value="${k}"${k === current() ? ' selected' : ''}>${n}</option>`).join('') + '</select>' +
        '<button data-step="1" aria-label="Next palette">›</button>' +
        '<span style="margin-left:6px">Scheme</span>' + schemes.map(([k, n]) =>
        `<button data-scheme="${k}" aria-pressed="${k === scheme}">${n}</button>`).join('');
    };
    box.addEventListener('change', (e) => e.target.matches('select') && setPalette(e.target.value));
    box.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.step) {
        const i = palettes.findIndex(([k]) => k === current());
        setPalette(palettes[(i + Number(b.dataset.step) + palettes.length) % palettes.length][0]);
      } else {
        save('scheme', b.dataset.scheme);
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.scheme = b.dataset.scheme === 'auto' ? (dark ? 'dark' : 'light') : b.dataset.scheme;
        render();
      }
    });
    render();
    document.body.append(box);
  })();
  // The demos need SharedArrayBuffer (QEMU's threads); say so where the
  // page couldn't get it.
  if (!crossOriginIsolated) {
    for (const el of document.querySelectorAll('.isolation-warning')) el.hidden = false;
  }
</script>
