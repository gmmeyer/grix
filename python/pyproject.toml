[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grix"
version = "0.0.7"
description = "Run Linux programs in capability-scoped grix sandboxes, from Python"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }

[tool.setuptools]
packages = ["grix"]
