[package]
name = "agentbox-kernel"
description = "agentbox guest kernel: runs one Linux program with a capability-scoped syscall layer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# The kernel targets bare metal, so it is its own workspace.
[workspace]

[[bin]]
name = "agentbox-kernel"
test = false
bench = false

[dependencies]
agentbox-abi = { path = "../crates/abi" }
linked_list_allocator = "0.10"
spin = "0.10"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = 1
