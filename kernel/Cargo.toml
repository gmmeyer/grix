[package]
name = "grix-kernel"
description = "grix guest kernel: runs one Linux program with a capability-scoped syscall layer"
version = "0.0.75"
edition = "2024"
license = "MIT"

# The kernel targets bare metal, so it is its own workspace.
[workspace]

[[bin]]
name = "grix-kernel"
test = false
bench = false

[dependencies]
grix-abi = { path = "../crates/abi" }
grix-netstack = { path = "../crates/netstack" }
talc = { version = "4", default-features = false, features = ["lock_api"] }
spin = { version = "0.10", features = ["lock_api"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = 1
