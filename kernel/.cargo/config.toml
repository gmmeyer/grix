[build]
# softfloat: the kernel never touches FP/SIMD registers, so user FP state
# survives syscalls and faults without being saved.
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
rustflags = ["-C", "relocation-model=static", "-C", "force-frame-pointers=yes"]

# x86_64 (`--target x86_64-unknown-none`, softfloat too): linked where it
# runs, not as a PIE; the high half at 0xffff8000_00000000 is outside the
# kernel code model's top 2 GiB, hence the large one.
[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static", "-C", "code-model=large", "-C", "force-frame-pointers=yes"]
