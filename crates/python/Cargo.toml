[package]
name = "grix-python"
description = "grix's native Python module (grix._native)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# An extension module: Python provides its symbols, so there's nothing to
# link a test program against.
test = false
doctest = false

[dependencies]
grix = { path = "../grix" }
anyhow = "1"
serde_json = "1"
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.30"
