[package]
name = "grix-web"
description = "grix's host side for a browser: boot images and the console's frames, as wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
grix-abi = { path = "../abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
