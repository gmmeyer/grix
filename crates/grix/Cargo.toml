[package]
name = "grix"
description = "Run Linux programs in a capability-scoped Rust unikernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "grix"
path = "src/main.rs"

[dependencies]
grix-abi = { path = "../abi" }
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
sha2 = "0.10"
ureq = "2"
ruzstd = "0.9"
base64 = "0.22"
url = "2"
